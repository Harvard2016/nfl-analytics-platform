[project]
name = "gridiron-lens"
version = "0.1.0"
description = "NFL analytics platform: three independent ML systems (coverage, pregame, highlights) behind one website."
requires-python = ">=3.12,<3.14"
dependencies = [
    "polars>=1.0",
    "pyarrow>=16",
    "duckdb>=1.0",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "pydantic>=2.7",
    "typer>=0.12",
    "pyyaml>=6",
    "joblib>=1.4",
    "pandas>=3.0.6",
    "torch>=2.14.1",
    "huggingface-hub>=2.1.1",
    "psutil>=7.2.2",
]

[project.scripts]
coverage-lens = "gridiron_lens.coverage.cli:app"

[project.optional-dependencies]
service = [
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]
extract = [
    "open-clip-torch>=3.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridiron_lens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
ignore = ["PLC0206"]  # iterating dict keys while filling the same dict is intended in the bootstrap helpers
